  <!-- Content Security Policy: Der Browser fuehrt nur Skripte aus den
       eigenen Dateien aus. Einzige Ausnahme ist Firebase fuer das
       gemeinsame Konto: die Skripte von www.gstatic.com (unten, mit
       Pruefsumme) und Verbindungen zu *.googleapis.com.
       Eingeschleuster Code (Inline-Skripte, Ereignis-Attribute, andere
       fremde Adressen) wird blockiert. Neue fremde Adresse = hier eintragen.
       datenschutz.html und impressum.html bleiben ohne diese Ausnahme. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; connect-src 'self' https://*.googleapis.com; base-uri 'none'; form-action 'self'; object-src 'none'">
